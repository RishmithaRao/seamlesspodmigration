---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-manager-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: pod-exec-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get","watch", "list", "create", "delete","update", "exec"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-exec-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: project-manager-sa
  namespace: default
roleRef:
  kind: Role
  name: pod-exec-role
  apiGroup: rbac.authorization.k8s.io
